</head><body><div><div class="inner"><h1>穷人生孩子罪孽深重</h1><div class="time">2026-10-04</div><div class="title-margin"></div><p>生孩子真是一件罪孽深重的事情</p>
<p>你把一个陌生的生命带到世界上</p>
<p>让他受尽世界的苦难，郁郁不得志</p>
<p>而你甚至要求他再生孩子、重蹈你的覆辙</p>
<p>如此往复循环</p>
<p>世界上多了好几代受苦受难的生命</p>
<p>罪孽深重</p>
<br>


<p>你来世界上，是享福的，就要感谢你的父母给你生命</p>
<p>你来世界上，是受苦的，就不要让这种罪孽继续下去</p>
<br>


<p>什么是好的生活？见《<a href="https://crazy.smallyu.net/2026/01/28/%E4%B8%8D%E7%90%86%E8%A7%A3%E4%B8%BA%E4%BB%80%E4%B9%88%E6%9C%89%E4%BA%BA%E6%95%A2%E7%94%9F%E5%AD%A9%E5%AD%90/">不理解为什么有人敢生孩子</a>》</p>
