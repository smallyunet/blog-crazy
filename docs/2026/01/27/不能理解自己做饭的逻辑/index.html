</head><body><div><div class="inner"><h1>不能理解自己做饭的逻辑</h1><div class="time">2026-01-27</div><div class="title-margin"></div><p>从事先买菜到做饭，至少需要一到两个小时的时间才能完成做饭、吃饭这件事情。</p>
<p>美团上拼单只需15块钱就能想吃什么吃什么，不但好吃、样式多，而且不需要花费自己的任何时间。</p>
<p>所以投入时间去做饭是一件性价比很低、很难理解的事情。</p>
