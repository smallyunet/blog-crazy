</script><div><div class="inner"><h1>什么是俗</h1><div class="time">2026-04-25</div><ul class="tags"><li><span>#</span><a href="/tags/观点/">观点</a></li></ul><p>结婚生子，家长里短，柴米油盐，就是俗。<br>胸无大志，安居乐业，就是俗。<br>趋炎附势，人云亦云，为生计奔波，就是俗。    </p>
<p>自从工作以来，工作上的一些小钱比如打车、吃饭、个别网络上的开销之类，从来都懒得填工单、去申请报销。为了那么点小钱刻意报销，太无聊了，不值得操作，很俗。</p>
<p>想跳槽就跳槽，为了工资忍受垃圾工作、垃圾同事，被每个月挣那点钱拿捏，唯唯诺诺，就是俗。</p>
<p>代码里出现中文，就是俗。</p>
<p>为了结婚找对象、百般讨好女性，实际上是一种价值交换的思路，就是俗。</p>
