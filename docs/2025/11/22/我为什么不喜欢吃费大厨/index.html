</head><body><div><div class="inner"><h1>我为什么不喜欢吃费大厨</h1><div class="time">2025-11-22</div><div class="title-margin"></div><p>因为桌子太小了，特别窄，吃的一点都不体面。</p>
<p>不得不承认费大厨的菜好吃，而且不贵，人均不到 100，也难怪费大厨的门口时刻有一大堆人在排队。</p>
<p>但正因为廉价，导致餐桌和装修也都有一种廉价感，尤其是桌面不大，两人桌点3个菜后，几乎已经没有空间。而且桌子和桌子之间距离很近，像是拼桌一样。</p>
<p>不体面。</p>
